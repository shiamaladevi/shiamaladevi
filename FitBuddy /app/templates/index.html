<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitBuddy</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="page"><section class="card">
<div class="brand">🏋️ FitBuddy</div><h1>AI Fitness Plan Generator</h1>
<p>Create a personalized 7-day workout plan with Gemini AI.</p>
{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}
<form method="post" action="/generate-workout">
<label>Name</label><input name="username" required>
<label>User ID</label><input name="user_id" required placeholder="FB001">
<label>Age</label><input type="number" name="age" min="13" max="100" required>
<label>Weight (kg)</label><input type="number" name="weight" min="1" max="500" step="0.1" required>
<label>Fitness Goal</label><select name="goal" required>
<option value="">Select goal</option><option>Weight loss</option><option>Muscle gain</option>
<option>General wellness</option><option>Flexibility</option><option>Endurance</option></select>
<label>Workout Intensity</label><select name="intensity" required>
<option value="">Select intensity</option><option value="low">Low</option>
<option value="medium">Medium</option><option value="high">High</option></select>
<button>Generate Plan ✨</button></form>
<a href="/view-all-users">Admin / View All Users</a>
</section></main></body></html>
